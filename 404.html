<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Muhammad Ali Sajjad</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F5F6FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0F22" media="(prefers-color-scheme: dark)">
  <!--
    GitHub Pages shows this page for any missing URL, however deep (e.g. /a/b/c).
    That's why every path here starts with "/" (the site root) instead of being relative.
  -->
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

  <!-- Runs before any CSS so the page is drawn in the right theme from the first frame. -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (error) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">

  <!-- Only this page needs these few rules, so they live here rather than in a shared file. -->
  <style>
    .lost {
      position: relative;
      display: grid;
      align-items: center;
      min-height: calc(100vh - 120px);
      padding: 60px 0 90px;
    }

    .lost-in {
      position: relative;
      z-index: 1;
    }

    .lost .h1 .accent {
      color: var(--accent);
    }

    .lost p {
      max-width: 30em;
      font-size: 19px;
      color: var(--muted);
      animation: fadeUp .8s .3s both;
    }

    .lost .btn {
      margin-top: 34px;
      animation: fadeUp .8s .42s both;
    }
  </style>

  <script src="/js/theme.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="nav">
    <div class="nav-in">
      <a class="brand" href="/"><span class="mark"><svg class="cube" viewBox="0 0 32 33" aria-hidden="true"><use href="/images/favicon.svg#cube"></use></svg></span><span>Sajjad</span></a>
      <div class="nav-right">
        <button class="toggle" type="button" aria-label="Switch between light and dark theme">
          <span class="knob"></span>
          <span class="ico sun"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>
          <span class="ico moon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"></path></svg></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="lost">
      <div class="grid-bg" aria-hidden="true"></div>
      <div class="orb o1" aria-hidden="true"></div>
      <div class="wrap lost-in">
        <span class="pill"><span class="ping"></span>Error 404</span>
        <h1 class="h1">
          <span class="line l1"><span class="in">Page not found.</span></span>
          <span class="line l2"><span class="in"><span class="accent">Let's get you home.</span></span></span>
        </h1>
        <p>The page you're looking for isn't here. The link may be wrong, or the page may have moved.</p>
        <a class="btn primary" href="/">Back to the home page <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
      </div>
    </section>
  </main>
</body>
</html>
